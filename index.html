<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Não Recusa</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #111318;
      color: white;
      padding: 20px;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #1d2129;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #303641;
      color: white;
      font-size: 18px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2f9e44;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .resultado {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
    }

    .avaliacao {
      text-align: center;
      font-size: 20px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🚗 NÃO RECUSA</h1>
    <div class="subtitulo">Calculador de corridas</div>

    <div class="card">

      <label>💰 Valor da corrida</label>
      <input id="valor" type="number" step="0.01" placeholder="Ex: 20,00">

      <label>📍 Distância em KM</label>
      <input id="km" type="number" step="0.1" placeholder="Ex: 10">

      <label>🎯 Sua meta mínima (R$/KM)</label>
      <input id="meta" type="number" step="0.01" value="2.00">

      <button onclick="calcular()">CALCULAR CORRIDA</button>

    </div>

    <div class="card">
      <div class="resultado" id="resultado">
        R$ 0,00 / KM
      </div>

      <div class="avaliacao" id="avaliacao">
        Informe os dados da corrida
      </div>
    </div>

  </div>

  <script>
    function calcular() {

      const valor = parseFloat(
        document.getElementById("valor").value
      );

      const km = parseFloat(
        document.getElementById("km").value
      );

      const meta = parseFloat(
        document.getElementById("meta").value
      );

      if (!valor || !km || km <= 0) {
        document.getElementById("avaliacao").innerText =
          "⚠️ Informe o valor e a distância.";
        return;
      }

      const porKm = valor / km;

      document.getElementById("resultado").innerText =
        "R$ " + porKm.toFixed(2).replace(".", ",") + " / KM";

      if (porKm >= meta) {
        document.getElementById("avaliacao").innerText =
          "🟢 CORRIDA DENTRO DA META";
      } else {
        document.getElementById("avaliacao").innerText =
          "🔴 ABAIXO DA SUA META";
      }
    }
  </script>

</body>
</html>
